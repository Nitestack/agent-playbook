name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: hook tests, shell lint and skill lint
    runs-on: ubuntu-24.04
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Hook tests
        run: bash hooks/tests/test-hooks.sh

      - name: Shell lint
        run: shellcheck -x -P SCRIPTDIR -S warning hooks/*.sh hooks/tests/*.sh

      - name: Skill lint
        run: bash hooks/tests/lint-skills.sh
